<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="hdr">
    <div class="hdr-row">
      <div class="brand">
        <div class="brand-dot"></div>
        <div>
          <h1 class="brand-name">My GEO Audit for LGE <span class="brand-version" id="brandVersion"></span></h1>
          <p class="brand-sub" data-i18n="brand_sub">AI Readability · SSR / Schema</p>
        </div>
      </div>
      <div class="hdr-actions">
        <button class="lang-toggle" id="langToggle" title="Toggle language">
          <span class="lang-pill" data-lang="ko">KO</span>
          <span class="lang-pill" data-lang="en">EN</span>
        </button>
        <a id="openWebLink" class="link-btn" target="_blank" rel="noopener" title="Open full app">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          <span data-i18n="open_web">Open app</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Body -->
  <main class="body">
    <p class="intro" data-i18n="intro">Analyze the page currently open in your active tab.</p>

    <button id="analyzeBtn" class="btn-primary">
      <span data-i18n="analyze_btn">Analyze this page</span>
    </button>

    <div class="hint" data-i18n="duration_hint">
      Analysis takes up to ~30 seconds.
    </div>

    <!-- Loading state -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p data-i18n="loading_msg">Measuring score, SSR/CSR and schema…</p>
    </div>

    <!-- Error -->
    <div id="error" class="error-box hidden"></div>

    <!-- Result -->
    <div id="result" class="result hidden">
      <!-- Score header -->
      <div class="score-card">
        <div class="score-url" id="resUrl"></div>
        <div class="score-main">
          <div class="score-value" id="resTotal">-</div>
          <div class="score-side">
            <span class="grade-badge" id="resGrade">-</span>
            <span class="page-type-badge" id="resPageType"></span>
          </div>
        </div>
        <div class="score-bar"><div class="score-bar-fill" id="resBar"></div></div>
      </div>

      <!-- CSR / SSR ratio (baseline reference, not live) -->
      <div class="csr-card" id="csrCard">
        <div class="csr-row">
          <span class="csr-label" data-i18n="csr_label">SSR / CSR</span>
          <span class="csr-tier-badge" id="csrTier">-</span>
        </div>
        <!-- baseline 표시 (page_type 표본 또는 사이트 전체 평균) -->
        <div id="csrData">
          <div class="csr-row csr-detail">
            <span><span data-i18n="ssr_chars">SSR chars</span>: <b id="ssrChars">-</b></span>
            <span><span data-i18n="csr_chars">CSR chars</span>: <b id="csrChars">-</b></span>
            <span><span data-i18n="ratio">Ratio</span>: <b id="csrRatio">-</b></span>
          </div>
          <div class="csr-baseline-note hidden" id="csrNote"></div>
        </div>
        <!-- baseline 자체가 없는 예외 케이스 -->
        <div class="csr-baseline-note hidden" id="csrUnavail" data-i18n="csr_unavailable">SSR/CSR baseline unavailable.</div>
      </div>

      <!-- Category cards (Performance / Accessibility / SEO / AI Readiness) -->
      <div id="categoryCards"></div>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
